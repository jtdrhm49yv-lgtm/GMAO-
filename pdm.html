<!DOCTYPE html>

<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta name="googlebot" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="robots" content="notranslate">
<title>GMAO - Maintenance Predictive</title>
<meta name="apple-mobile-web-app-title" content="PdM_GMAO">
<meta name="application-name" content="PdM_GMAO">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#080f0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#080f0c;--surface:#0f1a16;--surface2:#162219;--surface3:#1c2e24;
  --border:#253d30;--border2:#2e4d3c;--green:#22c97a;--amber:#f0a832;
  --red:#f04848;--blue:#38b6ff;--wa:#25D366;--wa2:#128C7E;
  --text:#e8f2ec;--text2:#9ab8a8;--text3:#5a7868;--card:#101a15;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px;}
.top{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#0b1410,#0f1a16);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;}
.logo{width:42px;height:42px;border:2px solid var(--amber);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
.top h1{font-size:16px;margin:0;letter-spacing:1px;color:var(--amber);}
.top .sub{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;}
.main{padding:16px;max-width:900px;margin:0 auto;}
.page-title{font-size:20px;font-weight:700;margin:6px 0 16px;}
.page-title span{color:var(--amber);}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
.card-h{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text);display:flex;justify-content:space-between;align-items:center;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:5px;}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:13px;color:var(--text);font-size:16px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;margin-bottom:10px;cursor:pointer;font-family:inherit;}
.btn-amber{background:var(--amber);color:#1a1206;}
.btn-green{background:var(--green);color:#04130b;}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2);}
.btn-sm{padding:9px 12px;font-size:13px;width:auto;display:inline-block;margin:0;border-radius:9px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.pill-ok{background:rgba(34,201,122,0.15);color:var(--green);}
.pill-warn{background:rgba(240,168,50,0.15);color:var(--amber);}
.pill-crit{background:rgba(240,72,72,0.15);color:var(--red);}
.pill-na{background:rgba(90,120,104,0.15);color:var(--text3);}
.mlist{display:flex;flex-direction:column;gap:10px;}
.mitem{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.mitem:active{border-color:var(--amber);}
.mitem .mname{font-size:17px;font-weight:700;}
.mitem .mmodel{font-size:12px;color:var(--text3);}
.comp-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;}
.comp-tab{flex:0 0 auto;padding:9px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border2);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.comp-tab.active{background:var(--amber);color:#1a1206;border-color:var(--amber);}
.back{background:none;border:none;color:var(--amber);font-size:15px;padding:8px 0;cursor:pointer;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);}
th{color:var(--text3);font-size:11px;text-transform:uppercase;font-weight:600;}
td.lbl{text-align:left;color:var(--text2);font-weight:600;}
.alert-box{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;border-left:4px solid;}
.alert-crit{background:rgba(240,72,72,0.08);border-color:var(--red);}
.alert-warn{background:rgba(240,168,50,0.08);border-color:var(--amber);}
.alert-box .at{font-weight:700;margin-bottom:3px;}
.empty{text-align:center;color:var(--text3);padding:30px 16px;font-size:14px;}
.chart-wrap{overflow-x:auto;margin:8px 0;}
.muted{color:var(--text3);font-size:12px;}
.tag-rm{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px;}
.add-link{color:var(--amber);font-size:14px;background:none;border:none;cursor:pointer;padding:6px 0;font-weight:600;}
.sample-row{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.compchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;margin:0 6px 6px 0;font-size:13px;}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;margin-top:6px;}
.legend span{display:flex;align-items:center;gap:4px;color:var(--text2);}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block;}
</style>
</head>
<body translate="no" class="notranslate">

<div class="top">
  <div class="logo">&#128202;</div>
  <div>
    <h1>MAINTENANCE PREDICTIVE</h1>
    <div class="sub">Endeavour Mining &mdash; Analyse d'huile</div>
  </div>
</div>

<div class="main" id="main">
  <!-- contenu injecte par JS -->
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
"use strict";
/* =================== DONNEES DE REFERENCE =================== */
var ENGINE_MODELS = ["C11","C13","C18","QSX15","6BT","NTA","QSZ13"];

// Composants par defaut (modifiables par machine) + huile habituelle
var DEFAULT_COMPONENTS = [
  {name:"Engine", oil:"Shell Rimula R4 15W40"},
  {name:"Hydraulics", oil:"Shell Tellus S2 M 68"},
  {name:"Compressor", oil:"Corona S4"},
  {name:"Gearbox", oil:"Shell Omala S2 G 220"},
  {name:"Rotary Head", oil:"Shell Omala S2 G 220"},
  {name:"Tramming motor Left", oil:"Shell Omala S2 G 220"},
  {name:"Tramming motor Right", oil:"Shell Omala S2 G 220"}
];

// Elements suivis (set predictif complet)
// unit: unite affichee ; key: cle de stockage
var ELEMENTS = [
  {key:"fe", label:"Fer (Fe)", unit:"ppm", type:"wear"},
  {key:"cu", label:"Cuivre (Cu)", unit:"ppm", type:"wear"},
  {key:"al", label:"Aluminium (Al)", unit:"ppm", type:"wear"},
  {key:"cr", label:"Chrome (Cr)", unit:"ppm", type:"wear"},
  {key:"si", label:"Silicium (Si)", unit:"ppm", type:"contam"},
  {key:"water", label:"Eau", unit:"ppm", type:"contam"},
  {key:"visc", label:"Viscosite 40C", unit:"mm2/s", type:"oil"},
  {key:"tbn", label:"TBN", unit:"mgKOH/g", type:"oil"},
  {key:"pq", label:"PQ Reading", unit:"", type:"wear"}
];

// Parametres machine par defaut (jauges tableau de bord / ECU) - modifiables par l utilisateur
// dir: "high"=anormal si trop haut, "low"=anormal si trop bas, "both"=informatif
var DEFAULT_PARAMS = [
  {key:"watertemp", label:"Water Temp", unit:"C", dir:"high", warn:100, crit:110},
  {key:"oilpress", label:"Oil Pressure", unit:"kPa", dir:"low", lowWarn:200, lowCrit:140},
  {key:"airtemp", label:"Discharge Air Temp", unit:"C", dir:"high", warn:110, crit:130},
  {key:"oiltemp", label:"Oil Temp", unit:"C", dir:"high", warn:110, crit:125},
  {key:"battery", label:"Battery", unit:"V", dir:"both", warn:0, crit:0},
  {key:"rpm", label:"Engine RPM", unit:"", dir:"both", warn:0, crit:0},
  {key:"topup", label:"Appoint huile moteur", unit:"L", dir:"high", warn:5, crit:10}
];

// Seuils de reference par defaut (ajustables plus tard avec les vrais seuils labo)
// Ces valeurs servent juste a colorer les alertes. warn = orange, crit = rouge.
// Pour Engine (moteur). Les autres composants utilisent les memes par defaut.
// visc et tbn ont une logique particuliere (tbn bas = mauvais).
var DEFAULT_THRESHOLDS = {
  fe:{warn:50, crit:100},
  cu:{warn:15, crit:30},
  al:{warn:15, crit:25},
  cr:{warn:5, crit:10},
  si:{warn:20, crit:40},
  water:{warn:500, crit:1000},
  pq:{warn:50, crit:100},
  visc:{lowWarn:0, lowCrit:0, highWarn:0, highCrit:0}, // 0 = pas de seuil fixe (on regarde la tendance)
  tbn:{lowWarn:3, lowCrit:1} // TBN: en dessous = mauvais
};

/* =================== STOCKAGE =================== */
var PDM_KEY="pdm_v1";
var DB = loadDB();
function loadDB(){
  try{ var d=JSON.parse(localStorage.getItem(PDM_KEY)); if(d&&d.machines) return d; }catch(e){}
  return {machines:[]}; // chaque machine: {id,name,model,components:[{name,oil,samples:[{date,hours,fe,cu,...}]}]}
}
function saveDB(){ try{ localStorage.setItem(PDM_KEY, JSON.stringify(DB)); }catch(e){} }
function uid(){ return "m"+Date.now()+Math.floor(Math.random()*1000); }

/* =================== NAVIGATION =================== */
var view = {screen:"home", machineId:null, compIdx:0};
function go(screen, machineId, compIdx){
  view.screen=screen;
  if(machineId!==undefined) view.machineId=machineId;
  if(compIdx!==undefined) view.compIdx=compIdx;
  if(screen==="machine"&&compIdx!==undefined) view.mode="etat";
  render();
  window.scrollTo(0,0);
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function getMachine(id){ for(var i=0;i<DB.machines.length;i++){ if(DB.machines[i].id===id) return DB.machines[i]; } return null; }

/* =================== RENDU PRINCIPAL =================== */
function render(){
  var m=document.getElementById("main");
  if(view.screen==="home") m.innerHTML=renderHome();
  else if(view.screen==="machine") m.innerHTML=renderMachine();
  else if(view.screen==="addMachine") m.innerHTML=renderAddMachine();
  else if(view.screen==="addSample") m.innerHTML=renderAddSample();
  else m.innerHTML=renderHome();
  // dessiner les graphiques apres injection
  if(view.screen==="machine"&&view.mode==="suivi") setTimeout(drawCharts,30);
}

/* =================== ECRAN ACCUEIL (liste machines) =================== */
function renderHome(){
  var h='<div class="page-title">Mes <span>machines</span></div>';
  h+='<button class="btn btn-amber" onclick="go(\'addMachine\')">+ Ajouter une machine</button>';
  if(!DB.machines.length){
    h+='<div class="empty">Aucune machine pour le moment.<br>Ajoute ta premiere foreuse pour commencer le suivi predictif.</div>';
    return h;
  }
  h+='<div class="mlist" style="margin-top:12px;">';
  for(var i=0;i<DB.machines.length;i++){
    var mc=DB.machines[i];
    var st=machineStatus(mc);
    var pill=st==="crit"?'<span class="pill pill-crit">Alerte</span>':(st==="warn"?'<span class="pill pill-warn">A surveiller</span>':(st==="ok"?'<span class="pill pill-ok">OK</span>':'<span class="pill pill-na">Pas de donnee</span>'));
    h+='<div class="mitem" onclick="go(\'machine\',\''+mc.id+'\',0)">'+
       '<div><div class="mname">'+esc(mc.name)+'</div><div class="mmodel">Moteur '+esc(mc.model||"-")+' &middot; '+(mc.components?mc.components.length:0)+' composants</div></div>'+
       '<div>'+pill+'</div></div>';
  }
  h+='</div>';
  return h;
}

// statut global d une machine = pire statut de ses composants
function machineStatus(mc){
  var worst="na";
  if(!mc.components) return worst;
  for(var i=0;i<mc.components.length;i++){
    var s=componentStatus(mc.components[i]);
    if(s==="crit") return "crit";
    if(s==="warn") worst="warn";
    else if(s==="ok"&&worst==="na") worst="ok";
  }
  return worst;
}
// statut d un composant = pire alerte de son dernier echantillon
function componentStatus(comp){
  if(!comp.samples||!comp.samples.length) return "na";
  var last=comp.samples[comp.samples.length-1];
  var prev=comp.samples.length>1?comp.samples[comp.samples.length-2]:null;
  var worst="ok";
  for(var i=0;i<ELEMENTS.length;i++){
    var lvl=elementLevel(ELEMENTS[i].key, last, prev);
    if(lvl==="crit") return "crit";
    if(lvl==="warn") worst="warn";
  }
  return worst;
}
// niveau d un element : "ok" / "warn" / "crit" selon seuil ET tendance
function elementLevel(key, last, prev){
  var v=parseFloat(last[key]);
  if(isNaN(v)) return "ok";
  var th=DEFAULT_THRESHOLDS[key];
  var level="ok";
  if(key==="tbn"){
    // TBN bas = mauvais
    if(th){ if(v<=th.lowCrit) level="crit"; else if(v<=th.lowWarn) level="warn"; }
    return level;
  }
  if(key==="visc"){
    // viscosite: on se base surtout sur la tendance (variation > 15% = warn, >25% = crit)
    if(prev){ var pv=parseFloat(prev[key]); if(!isNaN(pv)&&pv>0){ var ch=Math.abs(v-pv)/pv; if(ch>=0.25) level="crit"; else if(ch>=0.15) level="warn"; } }
    return level;
  }
  // elements d usure / contamination : seuil
  if(th){ if(v>=th.crit) level="crit"; else if(v>=th.warn) level="warn"; }
  // tendance : si la valeur a plus que double par rapport au prelevement precedent -> au moins warn
  if(prev){ var p=parseFloat(prev[key]); if(!isNaN(p)&&p>0&&v>=2*p&&v>=(th?th.warn*0.5:5)){ if(level==="ok") level="warn"; } }
  return level;
}

/* =================== AJOUTER UNE MACHINE =================== */
function renderAddMachine(){
  var h='<button class="back" onclick="go(\'home\')">&#8592; Retour</button>';
  h+='<div class="page-title">Ajouter une <span>machine</span></div>';
  h+='<div class="card">';
  h+='<div class="field"><label>Numero de machine</label><input id="nm-name" placeholder="ex: DR218"></div>';
  var opts='';
  for(var i=0;i<ENGINE_MODELS.length;i++){ opts+='<option>'+ENGINE_MODELS[i]+'</option>'; }
  h+='<div class="field"><label>Modele de moteur</label><select id="nm-model">'+opts+'</select></div>';
  h+='<div class="field"><label>Composants suivis</label><div class="muted" style="margin-bottom:8px;">Decoche ceux qui ne concernent pas cette machine.</div><div id="nm-comps">';
  for(var c=0;c<DEFAULT_COMPONENTS.length;c++){
    h+='<label class="compchip"><input type="checkbox" style="width:auto;" checked data-comp="'+c+'"> '+esc(DEFAULT_COMPONENTS[c].name)+'</label>';
  }
  h+='</div></div>';
  h+='</div>';
  h+='<button class="btn btn-green" onclick="saveNewMachine()">Enregistrer la machine</button>';
  h+='<button class="btn btn-ghost" onclick="go(\'home\')">Annuler</button>';
  return h;
}
function saveNewMachine(){
  var name=(document.getElementById("nm-name").value||"").trim();
  if(!name){ alert("Entre le numero de la machine (ex: DR218)"); return; }
  var model=document.getElementById("nm-model").value;
  var checks=document.querySelectorAll('#nm-comps input[type=checkbox]');
  var comps=[];
  for(var i=0;i<checks.length;i++){
    if(checks[i].checked){ var idx=parseInt(checks[i].getAttribute("data-comp"),10); comps.push({name:DEFAULT_COMPONENTS[idx].name, oil:DEFAULT_COMPONENTS[idx].oil, samples:[]}); }
  }
  if(!comps.length){ alert("Choisis au moins un composant"); return; }
  DB.machines.push({id:uid(), name:name, model:model, components:comps});
  saveDB();
  go("machine", DB.machines[DB.machines.length-1].id, 0);
}

/* =================== FICHE MACHINE =================== */
function renderMachine(){
  var mc=getMachine(view.machineId);
  if(!mc) return renderHome();
  if(view.compIdx>=mc.components.length) view.compIdx=0;
  if(!view.mode) view.mode="etat";
  var h='<button class="back" onclick="go(\'home\')">&#8592; Mes machines</button>';
  h+='<div class="page-title">'+esc(mc.name)+' <span>'+esc(mc.model||"")+'</span></div>';
  // bascule Etat / Huile / Parametres / Archive
  h+='<div class="comp-tabs" style="margin-bottom:14px;">';
  h+='<div class="comp-tab'+(view.mode==="etat"?' active':'')+'" onclick="setMode(\'etat\')">&#128300; Etat</div>';
  h+='<div class="comp-tab'+(view.mode==="suivi"?' active':'')+'" onclick="setMode(\'suivi\')">&#128200; Huile</div>';
  var nParams=(mc.paramReadings?mc.paramReadings.length:0);
  h+='<div class="comp-tab'+(view.mode==="params"?' active':'')+'" onclick="setMode(\'params\')">&#127777; Parametres'+(nParams?" ("+nParams+")":"")+'</div>';
  var nDocs=(mc.docs?mc.docs.length:0);
  h+='<div class="comp-tab'+(view.mode==="archive"?' active':'')+'" onclick="setMode(\'archive\')">&#128206; Archive'+(nDocs?" ("+nDocs+")":"")+'</div>';
  h+='</div>';
  if(view.mode==="archive") return h+renderArchive(mc);
  if(view.mode==="params") return h+renderParams(mc);
  if(view.mode==="etat") return h+renderEtat(mc);
  var comp=mc.components[view.compIdx];
  // alertes globales de la machine
  h+=renderMachineAlerts(mc);
  // onglets composants
  h+='<div class="comp-tabs">';
  for(var i=0;i<mc.components.length;i++){
    var st=componentStatus(mc.components[i]);
    var dot=st==="crit"?" &#128308;":(st==="warn"?" &#128992;":(st==="ok"?" &#128994;":""));
    h+='<div class="comp-tab'+(i===view.compIdx?' active':'')+'" onclick="go(\'machine\',\''+mc.id+'\','+i+')">'+esc(mc.components[i].name)+dot+'</div>';
  }
  h+='</div>';
  // composant courant
  h+='<div class="card"><div class="card-h">'+esc(comp.name)+'<span class="muted">'+esc(comp.oil)+'</span></div>';
  h+='<button class="btn btn-amber" onclick="go(\'addSample\',\''+mc.id+'\','+view.compIdx+')">+ Nouveau prelevement</button>';
  if(!comp.samples||!comp.samples.length){
    h+='<div class="empty">Aucun prelevement pour ce composant.<br>Ajoute les valeurs du rapport labo pour voir les tendances.</div></div>';
    return h;
  }
  // courbes
  h+='<div class="muted" style="margin:10px 0 4px;">Tendances (les plus recentes a droite)</div>';
  for(var e=0;e<ELEMENTS.length;e++){
    h+='<div class="chart-wrap"><canvas id="ch-'+ELEMENTS[e].key+'" width="600" height="150" style="width:100%;height:150px;"></canvas></div>';
    h+='<div class="muted" style="text-align:center;margin-bottom:14px;">'+ELEMENTS[e].label+(ELEMENTS[e].unit?" ("+ELEMENTS[e].unit+")":"")+'</div>';
  }
  h+='</div>';
  // tableau des prelevements + statut
  h+='<div class="card"><div class="card-h">Prelevements</div>';
  h+=renderSampleTable(comp);
  h+='</div>';
  return h;
}
function setMode(mode){ view.mode=mode; render(); window.scrollTo(0,0); }

/* =================== ARCHIVE DE RAPPORTS (PDF / photos) =================== */
function renderArchive(mc){
  var h='<div class="card"><div class="card-h">Rapports labo</div>';
  h+='<div class="muted" style="margin-bottom:10px;">Ajoute le PDF ou la photo du rapport d\'huile. Il sera garde dans l\'app, classe par date.</div>';
  h+='<label class="btn btn-amber" style="text-align:center;cursor:pointer;">+ Ajouter un rapport (PDF / photo)'+
     '<input type="file" accept="application/pdf,image/*" style="display:none;" onchange="addDoc(event)"></label>';
  h+='</div>';
  var docs=(mc.docs||[]).slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
  if(!docs.length){ h+='<div class="empty">Aucun rapport archive pour cette machine.</div>'; return h; }
  h+='<div class="card"><div class="card-h">Documents ('+docs.length+')</div>';
  for(var i=0;i<docs.length;i++){
    var d=docs[i];
    var icon=d.type&&d.type.indexOf("pdf")>=0?"&#128196;":"&#128247;";
    h+='<div class="sample-row"><div onclick="openDoc(\''+mc.id+'\',\''+d.id+'\')" style="flex:1;cursor:pointer;">'+
       '<div style="font-weight:600;">'+icon+' '+esc(d.name||"Rapport")+'</div>'+
       '<div class="muted">'+esc(d.date||"")+(d.label?" &middot; "+esc(d.label):"")+'</div></div>'+
       '<button class="tag-rm" onclick="delDoc(\''+mc.id+'\',\''+d.id+'\')">&#10005;</button></div>';
  }
  h+='</div>';
  return h;
}
function addDoc(ev){
  var file=ev.target.files&&ev.target.files[0];
  if(!file) return;
  var mc=getMachine(view.machineId); if(!mc) return;
  if(file.size>4*1048576){
    if(!confirm("Ce fichier est lourd ("+(file.size/1048576).toFixed(1)+" Mo). L'app peut devenir lente ou saturer la memoire. Continuer ?")) return;
  }
  var reader=new FileReader();
  reader.onload=function(e){
    if(!mc.docs) mc.docs=[];
    var label=prompt("Nom / composant du rapport (optionnel) :","")||"";
    var today=new Date().toISOString().slice(0,10);
    var date=prompt("Date du rapport (AAAA-MM-JJ) :",today)||today;

function addCustomParam(mid){
var mc=getMachine(mid); if(!mc) return;

if(!mc.params) mc.params=DEFAULT_PARAMS.slice();
var key=“p”+Date.now();
var obj={key:key, label:label, unit:unit, dir:(dir===“low”?“low”:“high”)};
if(dir===“low”){ obj.lowWarn=warn!==””?parseFloat(warn):null; obj.lowCrit=crit!==””?parseFloat(crit):null; }
else { obj.warn=warn!==””?parseFloat(warn):null; obj.crit=crit!==””?parseFloat(crit):null; }

// niveau d un parametre : ok / warn / crit
function paramLevel(p, val){
var v=parseFloat(val);
if(isNaN(v)) return “ok”;
if(p.dir===“low”){
if(p.lowCrit!=null&&v<=p.lowCrit) return “crit”;
if(p.lowWarn!=null&&v<=p.lowWarn) return “warn”;
return “ok”;
}
if(p.dir===“high”){
if(p.crit!=null&&p.crit>0&&v>=p.crit) return “crit”;
if(p.warn!=null&&p.warn>0&&v>=p.warn) return “warn”;
return “ok”;
}
return “ok”; // dir both = informatif
}
// statut global des parametres (dernier releve)
function paramsStatus(mc){
if(!mc.paramReadings||!mc.paramReadings.length) return “na”;
var readings=mc.paramReadings.slice().sort(function(a,b){ return (a.date||””).localeCompare(b.date||””); });
var last=readings[readings.length-1];
var params=machineParams(mc);
var worst=“ok”;
for(var i=0;i<params.length;i++){
var lvl=paramLevel(params[i], last[params[i].key]);
if(lvl===“crit”) return “crit”;
if(lvl===“warn”) worst=“warn”;
}
return worst;
}

// statut historique pannes : base sur le nombre de pannes recentes (30j)
function pannesStatus(mc){
if(!mc.pannes||!mc.pannes.length) return “na”;
var recent=0;
for(var i=0;i<mc.pannes.length;i++){ if(isRecent(mc.pannes[i].date)) recent++; }
if(recent>=3) return “crit”;

function isRecent(dateStr){
if(!dateStr) return false;
var d=new Date(dateStr+“T12:00:00”); if(isNaN(d.getTime())) return false;
var diff=(Date.now()-d.getTime())/(1000*60*60*24);
return diff<=30 && diff>=-1;
}
// croisement : combien de sources alertent
function crossStatus(oil,par,his){
var arr=[oil,par,his];
var known=arr.filter(function(x){ return x!==“na”; });
if(!known.length) return “na”;
var critCount=arr.filter(function(x){ return x===“crit”; }).length;
var warnCount=arr.filter(function(x){ return x===“warn”; }).length;
var alertCount=critCount+warnCount;
if(critCount>=2) return “crit”;          // 2 sources critiques
if(critCount===1&&alertCount>=2) return “crit”; // 1 crit + au moins une autre alerte
if(alertCount>=2) return “crit”;          // 2 sources ou plus en alerte
if(alertCount===1) return “warn”;         // 1 seule source en alerte
return “ok”;
}

var v=document.getElementById(“s-”+ELEMENTS[e].key).value;
s[ELEMENTS[e].key]=v;
if(v!==””) any=true;
}
if(!any){ alert(“Entre au moins une valeur”); return; }
comp.samples.push(s);
// trier par date croissante
comp.samples.sort(function(a,b){ return (a.date||””).localeCompare(b.date||””); });
saveDB();
go(“machine”, mc.id, view.compIdx);
}

/* =================== GRAPHIQUES (canvas simple) =================== */
function drawCharts(){
var mc=getMachine(view.machineId); if(!mc) return;
var comp=mc.components[view.compIdx]; if(!comp||!comp.samples) return;
for(var e=0;e<ELEMENTS.length;e++){
drawOneChart(ELEMENTS[e], comp.samples);
}
}
function drawOneChart(el, samples){
var cv=document.getElementById(“ch-”+el.key); if(!cv) return;
var ctx=cv.getContext(“2d”); var W=cv.width, H=cv.height;
ctx.clearRect(0,0,W,H);
// valeurs numeriques
var pts=[];
for(var i=0;i<samples.length;i++){ var v=parseFloat(samples[i][el.key]); pts.push(isNaN(v)?null:v); }
var vals=pts.filter(function(x){return x!==null;});
if(!vals.length){ ctx.fillStyle=”#5a7868”; ctx.font=“13px sans-serif”; ctx.fillText(“Pas de donnee”,10,H/2); return; }
var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
if(el.key!==“visc”&&el.key!==“tbn”){ min=Math.min(min,0); }
if(max===min){ max=min+1; }
var padL=38, padR=12, padT=14, padB=20;
var pw=W-padL-padR, ph=H-padT-padB;
function X(i){ return padL + (samples.length<=1?pw/2:(i/(samples.length-1))*pw); }
function Y(v){ return padT + ph - ((v-min)/(max-min))*ph; }
// grille horizontale + labels
ctx.strokeStyle=”#1c2e24”; ctx.fillStyle=”#5a7868”; ctx.font=“10px sans-serif”; ctx.lineWidth=1;
for(var g=0;g<=2;g++){
var gv=min+(max-min)*g/2; var gy=Y(gv);
ctx.beginPath(); ctx.moveTo(padL,gy); ctx.lineTo(W-padR,gy); ctx.stroke();
ctx.fillText(gv.toFixed(gv<10?1:0), 2, gy+3);
}
// seuils (lignes warn/crit) pour les elements concernes
var th=DEFAULT_THRESHOLDS[el.key];
if(th&&el.key!==“visc”&&el.key!==“tbn”){
if(th.warn&&th.warn<=max){ drawThreshold(ctx,Y(th.warn),padL,W-padR,”#f0a832”); }
if(th.crit&&th.crit<=max){ drawThreshold(ctx,Y(th.crit),padL,W-padR,”#f04848”); }
}
// ligne de donnees
ctx.strokeStyle=”#38b6ff”; ctx.lineWidth=2; ctx.beginPath();
var started=false;
for(var p=0;p<pts.length;p++){
if(pts[p]===null) continue;
var x=X(p), y=Y(pts[p]);
if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
}
ctx.stroke();
// points coleur selon niveau
for(var q=0;q<pts.length;q++){
if(pts[q]===null) continue;
var prev=q>0?samples[q-1]:null;
var lvl=elementLevel(el.key, samples[q], prev);
var col=lvl===“crit”?”#f04848”:(lvl===“warn”?”#f0a832”:”#22c97a”);
ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X(q),Y(pts[q]),3.5,0,Math.PI*2); ctx.fill();
}
}
function drawThreshold(ctx,y,x1,x2,color){
ctx.save(); ctx.strokeStyle=color; ctx.globalAlpha=0.5; ctx.setLineDash([4,4]); ctx.lineWidth=1;
ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke(); ctx.restore();
}

/* =================== SERVICE WORKER (hors-ligne) =================== */
if(“serviceWorker” in navigator){
window.addEventListener(“load”,function(){ navigator.serviceWorker.register(”./service-worker.js”).catch(function(){}); });
}

/* =================== DEMARRAGE =================== */
render();
</script>
